# AI Model Security Testing Configuration

# Model Configuration
models:
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-3.5-turbo"
    base_url: "https://api.openai.com/v1"
  
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet-20240229"
    base_url: "https://api.anthropic.com"
  
  groq:
    api_key: "${GROQ_API_KEY}"
    model: "llama-3.1-8b-instant"
    base_url: "https://api.groq.com/openai/v1"
  
  ollama:
    api_key: ""
    model: "llama3.2:latest"
    base_url: "http://localhost:11434"
    timeout: 60
    temperature: 0.7
    max_tokens: 500

# Testing Configuration
testing:
  max_attempts: 3
  timeout: 30
  temperature: 0.7
  max_tokens: 1000

# Logging Configuration
logging:
  level: "INFO"
  save_responses: true
  log_dir: "logs"
  
# Attack Categories to Test
attack_categories:
  - prompt_injection
  - role_play
  - hypothetical_scenarios

# Safety Filters
safety_filters:
  enabled: true
  check_harmful_content: true
  log_violations: true

# SAST + LLM Hybrid Configuration
sast:
  semgrep:
    enabled: true
    config: "auto"
    timeout: 60
  ast_fallback: true
  verifier:
    model: "openai" # default verifier model key from 'models'
    temperature: 0.1
    max_tokens: 1000
    confidence_threshold: "MEDIUM" # HIGH, MEDIUM, LOW
  output:
    default_format: "sarif" # sarif or json
    sarif_version: "2.1.0"

