name: AI Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install semgrep

    - name: Run Jailbreaker SAST
      # Uses the groq model (requires GROQ_API_KEY secret) to evaluate findings
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python run_objective.py --objective "run static scan" --target . --model groq
      continue-on-error: true # Allow pipeline to continue to upload SARIF even if issues are found

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
        category: jailbreaker-sast
