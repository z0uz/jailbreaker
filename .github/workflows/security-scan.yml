name: AI Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install semgrep

    - name: Run Jailbreaker SAST
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python run_objective.py --objective "run static scan" --target . --model groq --output results.sarif
      continue-on-error: true

    - name: Ensure SARIF File Exists
      run: |
        if [ ! -f results.sarif ]; then
          python -c "import json; json.dump({\"\$schema\":\"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json\",\"version\":\"2.1.0\",\"runs\":[{\"tool\":{\"driver\":{\"name\":\"Jailbreaker-Hybrid-SAST\",\"version\":\"1.0.0\",\"rules\":[]}},\"results\":[]}]}, open('results.sarif', 'w'))"
        fi

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
        category: jailbreaker-sast
