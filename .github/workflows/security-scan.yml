name: AI Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies (dev + semgrep)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install semgrep

    - name: Run Jailbreaker SAST
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python sast_scan.py --target ./src --output results.sarif --model groq
      continue-on-error: true

    - name: Ensure SARIF File Exists
      run: |
        python -c "import os, json; (not os.path.exists('results.sarif')) and open('results.sarif', 'w').write(json.dumps({'$schema':'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/src/Schemata/sarif-schema.json','version':'2.1.0','runs':[]}))"

    - name: Upload SARIF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jailbreaker-sast-sarif
        path: results.sarif

    - name: Upload SARIF to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: results.sarif
        category: jailbreaker-sast
