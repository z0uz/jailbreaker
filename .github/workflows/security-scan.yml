name: AI Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install semgrep

    - name: Run Jailbreaker SAST
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python sast_scan.py --target ./src --output results.sarif --model groq
      continue-on-error: true

    - name: Ensure SARIF File Exists
      run: |
        python -c "import os, json; (not os.path.exists('results.sarif')) and open('results.sarif', 'w').write(json.dumps({'\$schema':'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json','version':'2.1.0','runs':[{'tool':{'driver':{'name':'Jailbreaker-Hybrid-SAST','version':'1.0.0','rules':[]}},'results':[]}]}))"

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
        category: jailbreaker-sast
